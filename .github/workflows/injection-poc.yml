name: Script Injection PoC
on:
  release:
    types: [published]

jobs:
  demonstrate-injection:
    runs-on: ubuntu-latest
    steps:
      - name: Unsafe tag interpolation proof
        run: |
          echo "===== SCRIPT INJECTION PROOF ====="
          echo "github.event.release.tag_name is interpolated directly into this shell:"
          echo "Value: ${{github.event.release.tag_name}}"
          echo "===== END PROOF ====="
